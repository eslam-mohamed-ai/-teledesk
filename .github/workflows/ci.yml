name: CI

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: teledesk
          POSTGRES_DB: teledesk_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U teledesk -d teledesk_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg2://teledesk@localhost:5432/teledesk_test
      TEST_DATABASE_URL: postgresql+psycopg2://teledesk@localhost:5432/teledesk_test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Set test-only encryption key
        run: |
          python -c 'import secrets; print("JWT_SECRET=" + secrets.token_urlsafe(32))' >> "$GITHUB_ENV"
          python -c 'import secrets; print("MINIO_ACCESS_KEY=" + secrets.token_urlsafe(16))' >> "$GITHUB_ENV"
          python -c 'import secrets; print("MINIO_SECRET_KEY=" + secrets.token_urlsafe(32))' >> "$GITHUB_ENV"
          python -c 'from cryptography.fernet import Fernet; print("ENCRYPTION_KEY=" + Fernet.generate_key().decode())' >> "$GITHUB_ENV"

      - name: Lint (Python)
        run: python -m ruff check backend/app backend/migrations backend/tests

      - name: Type check (Python)
        run: python -m mypy

      - name: Lint (frontend)
        working-directory: frontend
        run: npm run lint

      - name: Type check (frontend)
        working-directory: frontend
        run: npm run typecheck

      - name: Upgrade fresh database
        run: python -m alembic -c backend/alembic.ini upgrade head

      - name: Test
        run: python -m pytest

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: python -m pip install pip-audit

      - name: Python dependency audit
        run: python -m pip-audit -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Node dependency audit
        working-directory: frontend
        run: npm audit --audit-level=moderate
