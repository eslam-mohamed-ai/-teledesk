name: CI

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: teledesk
          POSTGRES_DB: teledesk_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U teledesk -d teledesk_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg2://teledesk@localhost:5432/teledesk_test
      TEST_DATABASE_URL: postgresql+psycopg2://teledesk@localhost:5432/teledesk_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Set test-only encryption key
        run: |
          python -c 'import secrets; print("JWT_SECRET=" + secrets.token_urlsafe(32))' >> "$GITHUB_ENV"
          python -c 'import secrets; print("MINIO_ACCESS_KEY=" + secrets.token_urlsafe(16))' >> "$GITHUB_ENV"
          python -c 'import secrets; print("MINIO_SECRET_KEY=" + secrets.token_urlsafe(32))' >> "$GITHUB_ENV"
          python -c 'from cryptography.fernet import Fernet; print("ENCRYPTION_KEY=" + Fernet.generate_key().decode())' >> "$GITHUB_ENV"
      - name: Lint
        run: python -m ruff check backend/app backend/migrations backend/tests
      - name: Type check
        run: python -m mypy
      - name: Upgrade fresh database
        run: python -m alembic -c backend/alembic.ini upgrade head
      - name: Test
        run: python -m pytest
