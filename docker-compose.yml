
services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-teledesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-teledesk}
      POSTGRES_DB: ${POSTGRES_DB:-teledesk}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-teledesk} -d ${POSTGRES_DB:-teledesk}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    command: server -dir=/data -s3 -s3.port=8333
    ports:
      - "9000:8333"
    volumes:
      - miniodata:/data

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgresql+psycopg2://teledesk:teledesk@postgres:5432/teledesk}
    command: alembic upgrade head
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgresql+psycopg2://teledesk:teledesk@postgres:5432/teledesk}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: http://minio:8333
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgresql+psycopg2://teledesk:teledesk@postgres:5432/teledesk}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: http://minio:8333
    command: celery -A app.workers.celery_app:celery worker --loglevel=info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      migrate:
        condition: service_completed_successfully

  test:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgresql+psycopg2://teledesk:teledesk@postgres:5432/teledesk}
      TEST_DATABASE_URL: postgresql+psycopg2://teledesk:teledesk@postgres:5432/teledesk_test
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: http://minio:8333
      APP_ENV: test
    command: >
      sh -c "
        psql -h postgres -U teledesk -d teledesk -c 'CREATE DATABASE teledesk_test;' 2>/dev/null || true &&
        cd backend &&
        pytest tests/ -v
      "
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  miniodata:
